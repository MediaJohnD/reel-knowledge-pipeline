[project]
name = "reel-pipeline"
version = "0.1.0"
description = "Safe-by-default video/reel knowledge ingestion pipeline: URL -> transcript -> enriched Obsidian note -> optional Claude/Codex skill artifact."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.27.1",
    "pydantic>=2.14.2",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.52.1",
    "yt-dlp>=2026.10.26",
    "gallery-dl>=1.32.19",
    "trafilatura>=2.2.0",
    "filelock>=4.2.6",
    "playwright>=1.64.1",
    "pypdf>=6.21.4",
    "httpcore>=1.0",
]

[project.optional-dependencies]
local-whisper = ["faster-whisper>=1.0"]

[dependency-groups]
# Dev-only tooling, not part of this unpublished project's installable surface -
# `uv sync` includes this by default (no --extra needed), unlike local-whisper above
# which is a genuinely optional runtime feature.
dev = [
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "respx>=0.21",
    "ruff>=0.17.3",
    "pyright>=1.1",
    # Starlette 1.0's TestClient prefers httpx2 over httpx; without it every
    # webhook_server test emits a StarletteDeprecationWarning (harmless today,
    # but httpx support is expected to be removed in a future Starlette release).
    "httpx2>=2.16.0",
]

[project.scripts]
reel-pipeline = "reel_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# faster-whisper 1.2.1 passes av.open(metadata_errors=...), which PyAV 19 removed.
# Lift this once a faster-whisper release works with it; see
# test_real_faster_whisper_can_decode_audio_with_the_installed_av.
constraint-dependencies = ["av<19"]

[tool.hatch.build.targets.wheel]
packages = ["src/reel_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not playwright'"
markers = [
    "playwright: real (not mocked) Playwright render test - needs network + a Chromium binary, opt-in via `-m playwright`",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
