[project]
name = "reel-pipeline"
version = "0.1.0"
description = "Safe-by-default video/reel knowledge ingestion pipeline: URL -> transcript -> enriched Obsidian note -> optional Claude/Codex skill artifact."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "yt-dlp>=2024.8.6",
    "gallery-dl>=1.32.9",
    "trafilatura>=2.2.0",
    "filelock>=3.13",
]

[project.optional-dependencies]
local-whisper = ["faster-whisper>=1.0"]

[dependency-groups]
# Dev-only tooling, not part of this unpublished project's installable surface -
# `uv sync` includes this by default (no --extra needed), unlike local-whisper above
# which is a genuinely optional runtime feature.
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "ruff>=0.16.2",
    "pyright>=1.1",
    # Starlette 1.0's TestClient prefers httpx2 over httpx; without it every
    # webhook_server test emits a StarletteDeprecationWarning (harmless today,
    # but httpx support is expected to be removed in a future Starlette release).
    "httpx2>=2.9",
]

[project.scripts]
reel-pipeline = "reel_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reel_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
