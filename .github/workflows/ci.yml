name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      # --locked asserts uv.lock is already up to date with pyproject.toml and
      # errors otherwise. Plain `uv sync` would quietly re-lock, which would let
      # a stale committed lockfile sail past the `uv lock --check` inside
      # `make check` below - the check would be inspecting a lockfile this step
      # had just fixed. local-whisper is the production backend, and without it
      # the test that decodes audio with the real faster-whisper and PyAV skips:
      # the fakes stayed green while PyAV 19 broke every real transcription.
      - name: Install dependencies
        run: uv sync --locked --extra local-whisper

      # Deliberately one step calling `make check` rather than one step per
      # command. The two lists drifted apart once already: CI grew a
      # `ruff format --check .` step that `make check` never got, so the README's
      # "make check runs everything CI runs" was quietly false and a formatting
      # slip passed locally and failed here. With a single list there is nothing
      # left to keep in sync. The cost is the per-step pass/fail sidebar in the
      # Actions UI; the failing command and its output are still in the log.
      - name: Verify
        run: make check

      # Not in `make check`, which has to run on a machine with no browser. These
      # prove the render fallback's private-address guard in a real Chromium; the
      # route-handler stubs in the unit tests can't see what the browser itself sends.
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Browser tests
        run: make browser-test
