# Non-secret configuration for the reel pipeline.
# Secrets (API keys, webhook shared secret) live in environment variables / .env - see .env.example.
# Any value here can be overridden by an environment variable prefixed with REEL_
# (e.g. paths.vault_dir is overridden by REEL_VAULT_DIR).

paths:
  inbox_dir: data/inbox
  queue_file: data/inbox/queue.txt
  state_file: data/inbox/state.json
  needs_attention_file: data/inbox/needs-attention.txt
  logs_dir: data/logs
  tmp_dir: data/tmp
  vault_dir: data/notes
  skills_dir: data/generated_skills

prompts:
  enrich_transcript: config/prompts/enrich_transcript.md
  create_skill: config/prompts/create_skill.md

transcription:
  backend: local # local | openai
  local_model_size: base
  openai_model: whisper-1

# LLM used for enrichment and skill generation. "cerebras" is free (1M tokens/day)
# and far faster than local Ollama inference - switched here 2026-08-09 because
# qwen3:14b enrichment on this machine's GPU was the pipeline's actual bottleneck.
# Model is gpt-oss-120b (OpenAI open-weight, non-Chinese-origin - see CLAUDE.md's
# Chinese provider blocklist; Cerebras itself is a US company but also hosts
# Chinese-origin models like Qwen3-235B, which this deliberately avoids).
# "ollama" runs fully locally (no API key, no cost, slower) against an
# already-running Ollama instance with the model already pulled. Switch to
# "anthropic" (set ANTHROPIC_API_KEY) for hosted Claude instead.
llm:
  provider: cerebras # anthropic | ollama | groq | gemini | cerebras
  ollama_host: http://localhost:11434
  # Ollama defaults to a 4096-token context regardless of the model's real
  # capacity; long transcripts or multi-image carousels can exceed that.
  ollama_num_ctx: 16384

enrichment:
  # Model name meaning depends on llm.provider above - a Cerebras/Groq model id
  # here, an Ollama model tag, an Anthropic model id, or a Gemini model id.
  model: gpt-oss-120b
  max_tokens: 4096

skill_writer:
  model: gpt-oss-120b
  max_tokens: 2048
  enabled: true

# Photo posts / carousels (no video) are described by a vision-capable model
# instead of transcribed. Must support image input - check `ollama list` for a
# "vision" capability tag, or any current Claude model if provider is "anthropic".
# provider pinned to "ollama" explicitly: llm.provider above is "cerebras" for
# text enrichment, but Cerebras has no vision path (see llm_client.describe_images) -
# without this override, photo/carousel posts would fail with "vision-incapable
# llm provider" instead of using the local vision model that's already working.
image_description:
  model: mistral-small3.1
  max_tokens: 1024
  provider: ollama

# Platforms the downloader will attempt. Anything not matched here is rejected up
# front rather than attempted. Instagram is handled by gallery-dl (downloader.py's
# DispatchingDownloader), everything else (including Facebook, LinkedIn, and Google
# Drive) by yt-dlp - both require the same guardrails: no browser automation, and
# gated platforms require an explicitly-configured authenticated session
# (REEL_INSTAGRAM_COOKIES_FILE/BROWSER for Instagram, REEL_YTDLP_COOKIES_FILE/BROWSER
# for everything else) rather than working anonymously. Instagram, Facebook, and
# LinkedIn are each a deliberate, scoped exception to the "no social platform by
# default" guardrail in CLAUDE.md/AGENTS.md, made for low-volume personal use with
# the account owner's own real account (no burner) - see docs/runbook.md and the
# research note in the Obsidian vault under 20-Resources/Tools/. LinkedIn in
# particular has historically limited/unreliable yt-dlp extractor support outside
# LinkedIn Learning content - expect some LinkedIn URLs to fail even with cookies
# configured; that's a yt-dlp coverage gap, not a misconfiguration.
#
# "drive.google.com" is intentionally listed as a specific subdomain, not
# "google.com" - allow-list entries are matched against the full host, so this
# permits Drive video-file links (yt-dlp has a working GoogleDrive extractor)
# without opening every Google property (Docs, Sheets, Photos, Search, ...).
download:
  allowed_domains:
    - youtube.com
    - youtu.be
    - vimeo.com
    - tiktok.com
    - twitter.com
    - x.com
    - instagram.com
    - facebook.com
    - fb.watch
    - linkedin.com
    - drive.google.com
  blocked_domains: []

# Non-media knowledge sources - routed to TextFetcher (fetch + extract text)
# instead of Downloader (yt-dlp/gallery-dl). Public links only - no OAuth/API
# keys, no JS execution (not browser automation). As of 2026-08-10 this is a
# catch-all: any http(s) URL not matched by download.allowed_domains above
# routes here by default (see validators.classify_url_kind()) - the point is
# to capture whatever knowledge/topic the user finds interesting, not just an
# enumerated platform list. blocked_domains is the escape hatch for the rare
# domain that should be excluded. See docs/runbook.md's "GitHub and Notion
# text capture" section and
# docs/superpowers/specs/2026-07-16-text-capture-ingestion-design.md for the
# original (now superseded) scoped-allow-list design.
text_capture:
  blocked_domains: []

webhook:
  host: 127.0.0.1
  port: 8787

# Automatic disk/log housekeeping - runs at the top of every run_once() (so it
# fires on every webhook hit / queue check, no separate cron job needed). Set
# either value to 0 to keep everything forever instead of pruning.
maintenance:
  # data/tmp/<content_id>/ dirs older than this are deleted regardless of the
  # item's status - bounds disk use even for items that never succeed.
  tmp_retention_days: 30
  # needs-attention.txt lines older than this are dropped - the item is still
  # tracked in state.json either way, this only trims the human-readable log.
  needs_attention_retention_days: 30
  # state.json is fully rewritten on every mutation (O(n) per stage transition).
  # Once item count reaches this, run-once logs a warning so growth past this
  # project's "handful of reels" scale gets noticed rather than just slowly
  # degrading. Set to 0 to disable. See docs/runbook.md's "known limitations".
  state_size_warning_threshold: 500

# Retry policy for items that fail processing (download/transcribe/enrich/write
# errors - not validation/blocked-domain rejections, which never retry).
# Exponential backoff: after each failure, the item waits backoff_schedule_minutes[N]
# minutes before the next run_once() will pick it up again. After max_attempts
# failures, the item's status becomes failed_permanent and stops being retried
# automatically - it's still visible in state.json/needs-attention.txt for
# manual review.
retry:
  backoff_schedule_minutes: [1, 5, 30, 120, 480]
  max_attempts: 5
