# Who the reel reviewer (scripts/review_new_reels.py) works for. Optional.
# Copy to config/owner_profile.yaml (gitignored) and make it yours. Without it the
# reviewer judges general usefulness, nothing is tagged career/method/personal, and no
# GitHub account counts as your own.

# Your GitHub logins. Repos under them are marked `already-have`. The login that
# `gh api user` returns is always added.
github_logins: []

# Tools you already use that `--gen-have` can't detect (an API called from another
# project, a hosted service). A reel whose every named tool is here, or in
# config/have.txt, is marked `already-have`. Names are matched ignoring case and spaces.
have_tools: []

# Put into the review prompt. Name your businesses or projects so the reviewer can
# fill its `businesses` field, and state your constraints.
context: |
  Example: the owner runs two small businesses, Example Bakery and Example Studio.
  Constraints: free or self-serve tooling only, a human stays in the loop, everything
  must be ToS-compliant (no scraping behind logins, no spam automation).

# Regexes (case-insensitive) matched against a note's title and tags. A reel the
# reviewer would `skip` is tagged `career` or `personal` instead, so it stays findable.
career_patterns:
  - '\bfractional[\s-]+(?:c[a-z]?o|executive|exec|leader|head|vp|marketer|role|work|practice)s?\b'
  - '\binterim\s+(?:c[a-z]?o|executive|exec)s?\b|\bexpert[\s-]+networks?\b|\bconsultant\s*gigs?\b'
job_search_patterns:
  - '\bjob[\s-]+(?:search\w*|boards?|hunt\w*|seekers?|applications?|interviews?)\b'
  - '\b(?:remote|hidden)[\s-]+jobs?\b|(?<![\w-])interviews?\b|\brecruiters?\b|\bresumes?\b'
  - '\bcover[\s-]+letters?\b|\bupwork\b|\bsalary\b'
# Matched against the title only (tool reels carry these words in their tags). A skipped
# sales, copywriting or pricing how-to is tagged `method`: it has no repo to cite, so the
# tool-first reviewer would otherwise bury it. Checked after career, before personal.
method_patterns:
  - '\bcold[\s-]+(?:emails?|outreach|calls?)\b|\boutreach[\s-]+(?:campaigns?|sequences?|emails?)\b'
  - '\bsales[\s-]+(?:process|calls?|scripts?|frameworks?|techniques?|skills?)\b|\bfollow[\s-]?ups?\b'
  - '\b(?:pricing|copywriting|positioning|objections?|negotiat\w+)\b|\bdiscovery[\s-]+calls?\b'
personal_patterns:
  - '\b(?:travel\w*|trips?|flights?|hotels?|vacations?)\b'
  - '\b(?:habits?|routines?|workouts?|fitness|sleep)\b'
  - '\b(?:recipes?|cooking|baking|sourdough)\b'
